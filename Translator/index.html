<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LingoGhost - Screen Translator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Close Button -->
  <button id="closeBtn">✕</button>

  <!-- Control Panel -->
  <div id="controlPanel">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
      <h3 style="margin: 0;">LingoGhost</h3>
      <button id="settingsToggleBtn" style="background: none; border: none; cursor: pointer; font-size: 16px;">⚙️</button>
    </div>

    <label for="languageSelect">Target Language:</label>
    <select id="languageSelect">
      <option value="English">English</option>
      <option value="Dutch">Dutch</option>
      <option value="German">German</option>
      <option value="French">French</option>
      <option value="Spanish">Spanish</option>
      <option value="Japanese">Japanese</option>
      <option value="Chinese">Chinese</option>
    </select>

    <!-- Settings section for API Key (hidden by default) -->
    <div id="settingsPanel" class="hidden" style="display: flex; flex-direction: column; gap: 5px; border-top: 1px solid #444; padding-top: 8px;">
      <label for="apiKeyInput" style="font-size: 12px;">Gemini API Key:</label>
      <input type="password" id="apiKeyInput" placeholder="Paste your Gemini API key..." style="padding: 5px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
      <button id="saveApiKeyBtn" style="padding: 5px; background: #00ffcc; color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Save</button>
    </div>

    <button id="startBtn" style="padding: 8px; background: #00ffcc; color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Start Screen Share</button>
    <p id="status" style="margin: 0; font-size: 12px; color: #ccc;">Hotkey: Ctrl+Shift+S</p>
  </div>

  <!-- Scan indicator bottom right -->
  <div id="scanIndicator" class="hidden"></div>

  <!-- Transparent overlay for translations -->
  <div id="overlay"></div>

  <video id="screenVideo" autoplay style="display: none;"></video>

  <script src="script.js"></script>
</body>
</html>
